databases:
  - name: discord-access-db
    databaseName: discord_access
    user: postgres

services:
  - type: web
    name: discord-access-bot
    env: node
    plan: starter
    buildCommand: npm ci --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: discord-access-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false